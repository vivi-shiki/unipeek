[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
lab-render = { path = "crates/render" }
wgpu = "30"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ufbx = "0.11"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
