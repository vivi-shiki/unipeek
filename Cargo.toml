[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vivi-shiki/unipeek"
rust-version = "1.88"

[workspace.dependencies]
unipeek = { path = "crates/render" }
unipeek-unity = { path = "crates/unity" }
wgpu = "30"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ufbx = "0.11"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
