[package]
name = "unipeek-unity"
description = "Read Unity asset packages without a GPU: unitypackage index, Unity YAML, prefab and material binding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["unity", "unitypackage", "prefab", "yaml", "vrchat"]
categories = ["game-development", "parser-implementations", "encoding"]
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true
encoding_rs.workspace = true
sevenz-rust2.workspace = true

[features]
# Builders for synthetic packages, used by the tests of this crate and of unipeek.
testing = ["sevenz-rust2/compress"]

[dev-dependencies]
serde_json.workspace = true
sevenz-rust2 = { workspace = true, features = ["compress"] }
