[package]
name = "unipeek"
description = "Preview Unity asset packages: toon-style thumbnails and reports for asset managers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
unipeek-unity.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
anyhow.workspace = true
image.workspace = true
ufbx.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
unipeek-unity = { workspace = true, features = ["testing"] }
tar.workspace = true
flate2.workspace = true

[features]
default = ["cli"]
# The `unipeek` binary. Hosts that only link the library can turn it off.
cli = []

[[bin]]
name = "unipeek"
required-features = ["cli"]
