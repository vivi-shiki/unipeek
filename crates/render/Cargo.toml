[package]
name = "unipeek"
description = "Preview Unity asset packages: toon-style thumbnails and reports for asset managers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["unity", "unitypackage", "thumbnail", "toon", "vrchat"]
categories = ["game-development", "rendering", "graphics"]
rust-version.workspace = true

[dependencies]
unipeek-unity.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
image.workspace = true
ufbx.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
mikktspace.workspace = true
winit = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
unipeek-unity = { workspace = true, features = ["testing"] }
tar.workspace = true

[features]
default = ["cli", "view"]
# The `unipeek` binary. Hosts that only link the library can turn it off.
cli = []
# `unipeek view`, a window of its own (winit). Only the binary uses it; the library never does.
view = ["cli", "dep:winit"]

[[bin]]
name = "unipeek"
required-features = ["cli"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
